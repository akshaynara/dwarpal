name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]" pyflakes
      - run: python -m pyflakes src tests examples
      - run: pytest -q
      - name: Demo scenarios behave as designed
        run: DWARPAL_DATA_DIR=$RUNNER_TEMP/dwarpal dwarpal demo
      - name: Self-check
        run: DWARPAL_DATA_DIR=$RUNNER_TEMP/dwarpal dwarpal doctor
